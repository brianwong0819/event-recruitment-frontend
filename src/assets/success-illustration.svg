<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background elements -->
  <g class="confetti">
    <!-- Confetti pieces -->
    <circle cx="130" cy="100" r="10" fill="#FFC107" />
    <circle cx="80" cy="200" r="8" fill="#4CAF50" />
    <circle cx="200" cy="50" r="12" fill="#2196F3" />
    <circle cx="300" cy="120" r="9" fill="#F44336" />
    <circle cx="400" cy="80" r="10" fill="#9C27B0" />
    <circle cx="180" cy="300" r="8" fill="#3F51B5" />
    <circle cx="340" cy="270" r="11" fill="#00BCD4" />
    <circle cx="420" cy="220" r="9" fill="#FF9800" />
    
    <!-- Confetti lines -->
    <rect x="150" y="80" width="30" height="6" fill="#FFEB3B" transform="rotate(45, 165, 83)" />
    <rect x="360" y="100" width="25" height="6" fill="#8BC34A" transform="rotate(30, 375, 103)" />
    <rect x="100" y="240" width="35" height="7" fill="#E91E63" transform="rotate(-20, 117, 243)" />
    <rect x="280" y="200" width="28" height="5" fill="#009688" transform="rotate(60, 294, 202)" />
    <rect x="380" y="170" width="32" height="6" fill="#673AB7" transform="rotate(-45, 396, 173)" />
  </g>
  
  <!-- Success check mark in circle -->
  <g class="check-container">
    <circle cx="256" cy="256" r="110" fill="#4CAF50" opacity="0.2" />
    <circle cx="256" cy="256" r="90" fill="#4CAF50" />
    <path d="M216,256 L246,286 L296,236" stroke="white" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Celebration stars -->
  <g class="stars">
    <!-- Star 1 -->
    <g transform="translate(130, 150) scale(0.8)">
      <path d="M10,0 L13,7 L20,8 L15,13 L16,20 L10,17 L4,20 L5,13 L0,8 L7,7 Z" fill="#FFC107" />
    </g>
    <!-- Star 2 -->
    <g transform="translate(380, 140) scale(0.6)">
      <path d="M10,0 L13,7 L20,8 L15,13 L16,20 L10,17 L4,20 L5,13 L0,8 L7,7 Z" fill="#FF9800" />
    </g>
    <!-- Star 3 -->
    <g transform="translate(160, 340) scale(0.7)">
      <path d="M10,0 L13,7 L20,8 L15,13 L16,20 L10,17 L4,20 L5,13 L0,8 L7,7 Z" fill="#2196F3" />
    </g>
    <!-- Star 4 -->
    <g transform="translate(350, 360) scale(0.9)">
      <path d="M10,0 L13,7 L20,8 L15,13 L16,20 L10,17 L4,20 L5,13 L0,8 L7,7 Z" fill="#E91E63" />
    </g>
  </g>
  
  <!-- Animation styles -->
  <style>
    .confetti {
      animation: float 3s ease-in-out infinite;
    }
    .stars {
      animation: twinkle 2s ease-in-out infinite;
    }
    .check-container {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</svg> 